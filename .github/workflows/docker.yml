# Builds the combined single image (API + baked-in frontend) and pushes it to
# Docker Hub on every push to main and on version tags (v*).
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME = akashpanja
#   DOCKERHUB_TOKEN    = a Docker Hub access token
#     (hub.docker.com -> Account Settings -> Security -> New Access Token,
#      permissions: Read, Write, Delete)
#
# The per-service Dockerfiles (backend/Dockerfile, frontend/Dockerfile) are
# kept for split deployments; CI only builds the combined image.

name: docker

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  tags:
    - "v*"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: akashpanja/actionbridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
