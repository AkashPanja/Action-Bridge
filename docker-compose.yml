services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: doc_action_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single combined image: FastAPI + baked-in frontend (one port).
  # Images are built by CI (.github/workflows/docker.yml) and pushed to
  # akashpanja/actionbridge. To build locally instead, uncomment `build: .`
  app:
    image: akashpanja/actionbridge:latest
    # build: .
    restart: unless-stopped
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/doc_action_center
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  worker:
    image: akashpanja/actionbridge:latest
    # build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/doc_action_center
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      DEBUG: ${DEBUG:-false}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
