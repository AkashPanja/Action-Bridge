# ActionBridge on Synology NAS - ALL IN ONE container.
#
# Single container runs: API + baked-in frontend + background worker,
# with SQLite (one file) instead of Postgres. Lowest resource use.
#
# HOW TO USE
#  1. On your Synology: Container Manager -> Project -> Create.
#     - Project name: actionbridge
#     - Paste this file as docker-compose.yml.
#  2. Secrets below are pre-generated and ready to use. Keep this file private.
#  3. Press Next, review, Done. One container starts everything.
#  4. Open http://192.168.0.111:9347
#     Log in / register the first user, then add your Groq provider key and
#     Gmail mailbox credential in the app UI.
#
# NOTES
#  - First start takes 1-2 minutes (image pull).
#  - Everything (database + uploads) lives in the single `appdata` volume.
#    Back it up from Container Manager if the data matters.
#  - GUNICORN_WORKERS=1 on purpose: SQLite is happiest with a single writer.
#    Plenty for home/NAS use; use the 4-container compose for heavy loads.
#  - Stopping the project sends SIGTERM to the API; the background worker
#    exits with it (give it the default 10s grace period).

services:
  app:
    image: akashpanja/actionbridge:latest
    restart: unless-stopped
    ports:
      - "9347:8000"
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      SECRET_KEY: oZqZXth4lneWZHDtWDDfsVwoDU_3nDh_7Q9k6_QXKeOSlhRVI70favxDS4nCsJ-P
      APP_ENCRYPTION_KEY: zbpz3w2HId1SnYt22nv1RW8_0OgB1ShLMxxUZnz5FL4=
      SETUP_COMPLETE_FILE: /app/data/.setup-complete
      DEBUG: "false"
      GUNICORN_WORKERS: "1"
      CORS_ORIGINS: https://actionbridge.bnfkquodqjp.uk,http://192.168.0.111:9347,http://localhost:9347,http://localhost:5173
      FRONTEND_URL: https://actionbridge.bnfkquodqjp.uk
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - appdata:/app/data

volumes:
  appdata:
